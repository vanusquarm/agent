##################################################################

  ### PART 2

stages:

- stage: Run_Dependence
  jobs:
   - job: Run_Dependence
     pool:
      name: 'TestPool'
     steps:

            # 1. Checkout the code from the repository
      - task: UseDotNet@2
        name: 'DependenceInstall'
        displayName: 'Install_Depen'
        inputs:
          packageType: 'sdk'
          version: '8.x'
          installationPath: $(Agent.ToolsDirectory)/dotnet

      #        #. Add Docker setup before dotnet publish
      # - script: |
      #     echo "Setting up Docker..."
      #     docker --version
      #   displayName: 'Check Docker Installation'

            # 2. Restore dependencies
      - task: DotNetCoreCLI@2
        name: 'Restore'
        displayName: 'Restore'
        inputs:
          command: 'restore'
          projects: '**/Customers.API.csproj'

            # 3. Build the project
      - task: DotNetCoreCLI@2
        name: 'Build'
        displayName: Build
        inputs:
          command: 'build'
          projects: '**/Customers.API.csproj'
          arguments: '--configuration $(buildConfiguration)'

            # 4. Run tests
      - task: DotNetCoreCLI@2
        name: 'Test'
        displayName: 'Test'
        inputs:
          command: 'test'
          projects: '**/*Tests/Customers.API.csproj'
          arguments: '--configuration $(buildConfiguration) --collect "Code coverage"'

          #. Clean restore before publishing
      - script: dotnet restore --no-cache
        displayName: 'Restore Packages'

            # 5. Publish the build output
      - task: DotNetCoreCLI@2
        name: 'Publish'
        displayName: 'Publish'
        inputs:
          command: 'publish'
          publishWebProjects: false
          projects: '**/Customers.API.csproj'
          arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
          zipAfterPublish: false

            # 6. Publish build artifacts
      - task: PublishBuildArtifacts@1
        name: 'ArtifactBuild'
        displayName: 'Build_Artifact'
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)'
          ArtifactName: '$(artifactName)'
          publishLocation: 'Container'

