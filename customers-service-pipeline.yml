trigger:
  branches:
    include:
      - preprod
  
  paths:
         ### Include means file or dir to trigger a build
    include:
#      - path/to/your/folder/*
       - .src/Customers/Customers.API/*

pool:
    name: 'TestPool'
    
variables:
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
  artifactName: 'CustomersAPI'

